[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbuyer"
version = "0.1.0"
description = "Car purchase agent team - Phase 1 simulated negotiation lab"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
durable = ["dbos>=2"]
llm = ["pydantic-ai-slim[openai,anthropic,google]>=1"]
console = ["streamlit>=1.35", "pandas>=2"]
dev = ["pytest>=8", "dbos>=2", "pydantic-ai-slim>=1"]

[project.scripts]
carbuyer = "carbuyer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
